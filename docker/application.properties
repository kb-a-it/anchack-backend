jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.url=${JDBC_URL:jdbc:mysql://127.0.0.1:3306/anchack}
jdbc.username=${JDBC_USERNAME:root}
jdbc.password=${JDBC_PASSWORD:root}
kakao.client-id=${KAKAO_CLIENT_ID:}
kakao.client-secret=${KAKAO_CLIENT_SECRET:}
kakao.redirect-uri=${KAKAO_REDIRECT_URI:}

jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

molit.api.service-key=${MOLIT_API_SERVICE_KEY:}
